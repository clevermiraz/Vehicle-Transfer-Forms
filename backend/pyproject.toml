[project]
name = "vehicle-forms-backend"
version = "0.1.0"
description = "Vehicle ownership-transfer form filling (internal shop tool)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.26",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.8",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
